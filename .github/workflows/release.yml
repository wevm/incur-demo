name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changesets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version package'
          createGithubReleases: false
          publish: npm run release
          title: 'chore: version package'
          version: npm run version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  binaries:
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changesets.outputs.published == 'true')
    needs: changesets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          pending="$(
            find .changeset \
              -maxdepth 1 \
              -type f \
              -name '*.md' \
              ! -name README.md \
              -print \
              -quit
          )"
          if [[ -n "$pending" ]]; then
            printf '%s\n' 'Merge the Changesets version PR before releasing.' >&2
            exit 1
          fi

          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid stable package version: %s.\n' "$version" >&2
            exit 1
          fi
          if [[ "$version" == '0.0.0' ]]; then
            printf '%s\n' 'The initial Changesets version PR has not been merged.' >&2
            exit 1
          fi

          published="$(npm view "${package_name}@${version}" version 2>/dev/null || true)"
          if [[ "$published" != "$version" ]]; then
            printf '%s %s is not published on npm.\n' "$package_name" "$version" >&2
            exit 1
          fi

          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            if ! git show "${tag}:package.json" |
              jq -e \
                --arg name "$package_name" \
                --arg version "$version" \
                '.name == $name and .version == $version' > /dev/null; then
              printf 'Tag %s does not contain %s %s.\n' \
                "$tag" "$package_name" "$version" >&2
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email \
              '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$GITHUB_SHA" -m "$tag"
            git push origin "refs/tags/${tag}"
          fi

          if release="$(
            gh release view "$tag" \
              --json assets,isDraft,isPrerelease,tagName \
              2>/dev/null
          )"; then
            if [[ "$(jq -r '.isPrerelease' <<< "$release")" != 'false' ]]; then
              printf 'Release %s is a prerelease.\n' "$tag" >&2
              exit 1
            fi
            if [[ "$(jq -r '.isDraft' <<< "$release")" != 'true' ]]; then
              printf 'Release %s is already published.\n' "$tag"
              {
                printf 'publish=false\n'
                printf 'tag=%s\n' "$tag"
                printf 'upload=false\n'
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$tag" \
              --draft \
              --generate-notes \
              --title "$tag" \
              --verify-tag
            release="$(
              gh release view "$tag" \
                --json assets,isDraft,isPrerelease,tagName
            )"
          fi

          expected=(
            'incur-demo-darwin-arm64.gz'
            'incur-demo-darwin-x64.gz'
            'incur-demo-linux-arm64-glibc.gz'
            'incur-demo-linux-arm64-musl.gz'
            'incur-demo-linux-x64-glibc-baseline.gz'
            'incur-demo-linux-x64-musl-baseline.gz'
            'incur-demo-windows-arm64.exe.gz'
            'incur-demo-windows-x64-baseline.exe.gz'
            'SHA256SUMS'
            'install.ps1'
            'install.sh'
          )

          present=0
          for asset in "${expected[@]}"; do
            if jq -e --arg asset "$asset" \
              '.assets[]? | select(.name == $asset)' \
              <<< "$release" > /dev/null; then
              present=$((present + 1))
            fi
          done

          if [[ "$present" -eq 0 ]]; then
            upload=true
          elif [[ "$present" -eq "${#expected[@]}" ]]; then
            upload=false
          else
            printf \
              'Draft %s contains %s of %s managed assets. Remove the partial assets before retrying.\n' \
              "$tag" "$present" "${#expected[@]}" >&2
            exit 1
          fi

          {
            printf 'publish=true\n'
            printf 'tag=%s\n' "$tag"
            printf 'upload=%s\n' "$upload"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload binaries
        if: steps.release.outputs.upload == 'true'
        uses: wevm/incur/release@v1
        with:
          release_tag: ${{ steps.release.outputs.tag }}
          smoke_command: ping

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
